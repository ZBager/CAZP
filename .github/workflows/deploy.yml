name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race each other onto the server.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Generated files are up to date
        run: |
          node tools/build-agent-files.mjs
          if ! git diff --quiet; then
            echo "::error::Generated files are stale. Run 'node tools/build-agent-files.mjs' locally and commit the result."
            git diff --stat
            exit 1
          fi

      - name: JavaScript parses
        run: |
          node --check js/main.js
          node --check dlc/js/main.js
          node --check tools/build-agent-files.mjs
          node --check deploy/worker.mjs

      - name: events.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('data/events.json', 'utf8'))"

      - name: Warn if deployment is not configured
        if: vars.DEPLOY_HOST == ''
        run: |
          echo "::notice::DEPLOY_HOST is not set, so the deploy job will be skipped. See DEPLOYMENT.md."

  deploy:
    name: Deploy to server
    needs: verify
    runs-on: ubuntu-latest
    # Skip cleanly instead of failing when the server is not configured yet.
    if: vars.DEPLOY_HOST != ''
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS secrets must both be set. See DEPLOYMENT.md."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy with rsync
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_RRSYNC: ${{ vars.DEPLOY_RRSYNC }}
        run: |
          if [ "$DEPLOY_RRSYNC" = "true" ]; then
            # authorized_keys pins the destination via command="rrsync -wo <root>"
            # and rrsync resolves paths relative to it, so an absolute DEPLOY_PATH
            # would land the site in <root>/<DEPLOY_PATH>. It is never sent, hence
            # no guard below. "." not "/": rrsync rejects absolute paths outright.
            echo "::notice::DEPLOY_RRSYNC is true — the server's rrsync root decides the destination; DEPLOY_PATH is not sent."
            dest="."
          else
          # --delete wipes whatever is not in the repo, so a wrong path here
          # takes a directory with it. Trailing slashes go first — otherwise
          # "/var/" sails past a check for "/var".
          target="$DEPLOY_PATH"
          while [ "$target" != "/" ] && [ "${target%/}" != "$target" ]; do
            target="${target%/}"
          done
          case "$target" in
            /*) ;;
            *)
              echo "::error::DEPLOY_PATH ('$DEPLOY_PATH') must be an absolute path."
              exit 1
              ;;
          esac
          case "$target" in
            ""|"/"|"/bin"|"/boot"|"/dev"|"/etc"|"/home"|"/lib"|"/media"|"/mnt"\
            |"/opt"|"/proc"|"/root"|"/run"|"/sbin"|"/srv"|"/sys"|"/tmp"|"/usr"\
            |"/var"|"/var/www"|"/srv/www")
              echo "::error::DEPLOY_PATH ('$DEPLOY_PATH') is a system directory. Point it at the site's own directory, e.g. /srv/cazp or /var/www/cazp."
              exit 1
              ;;
          esac
          dest="$target/"
          fi
          if [ -z "$DEPLOY_USER" ]; then
            echo "::error::DEPLOY_USER variable is not set. See DEPLOYMENT.md."
            exit 1
          fi

          rsync --archive --compress --delete --human-readable --stats \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=yes" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tools/' \
            --exclude='deploy/' \
            --exclude='README.md' \
            --exclude='CLAUDE.md' \
            --exclude='DEPLOYMENT.md' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$dest"

      - name: Smoke test
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CURL_ANSWER: ${{ vars.CURL_ANSWER }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL not set — skipping smoke test."
            exit 0
          fi
          base="${SITE_URL%/}"
          insecure="http://${base#https://}"
          fail=0
          check() {   # check <label> <expected> <actual>
            if [ "$3" = "$2" ]; then
              printf '  %-52s ok\n' "$1"
            else
              printf '  %-52s FAIL\n    expected: %s\n    actual:   %s\n' "$1" "$2" "$3"
              echo "::error::Smoke test: $1 — expected '$2', got '$3'"
              fail=1
            fi
          }

          echo "Checking $base ..."
          for path in "/" "/data/events.json" "/llms.txt"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$base$path")
            check "$path returns 200" "200" "$code"
          done

          # Anything asking for HTML must still get it, static summary included —
          # that is what crawlers and AI agents read.
          page=$(curl -sS --max-time 20 -H 'Accept: text/html' "$base/")
          case "$page" in
            *"<title>"*) html_title=yes ;; *) html_title=no ;;
          esac
          case "$page" in
            *'id="static-summary"'*) html_summary=yes ;; *) html_summary=no ;;
          esac
          check "/ with Accept: text/html is the page" "yes" "$html_title"
          check "/ with Accept: text/html has the static summary" "yes" "$html_summary"

          case "$(curl -sS --max-time 20 "$base/data/events.json")" in
            *'"startDate"'*) json=yes ;; *) json=no ;;
          esac
          check "/data/events.json is still the data" "yes" "$json"

          # The Worker is deployed by hand, so this checks the live edge, not
          # anything rsync just copied. Set CURL_ANSWER to 'true' once it is
          # routed — see DEPLOYMENT.md, "The terminal answer".
          if [ "$CURL_ANSWER" = "true" ]; then
            echo "Checking the terminal answer ..."
            check "curl $base/ prints the answer" "Nie." "$(curl -sS --max-time 20 "$base/")"
            check "curl $insecure/ prints the answer" "Nie." "$(curl -sS --max-time 20 "$insecure/")"
            check "curl -H 'Accept-Language: en' is English" "No." \
              "$(curl -sS --max-time 20 -H 'Accept-Language: en' "$base/")"
            check "browsers on http:// are still redirected" "301" \
              "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -H 'Accept: text/html' "$insecure/")"
            check "the redirect target is https" "$base/" \
              "$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 20 -H 'Accept: text/html' "$insecure/")"
            # Ask as a browser would — the Worker's plain-text reply carries no
            # HSTS by design, and no browser ever receives it.
            check "HSTS survives on https" "yes" \
              "$(curl -sS -o /dev/null -D - --max-time 20 -H 'Accept: text/html' "$base/" | grep -qi '^strict-transport-security:' && echo yes || echo no)"
          else
            echo "::notice::CURL_ANSWER is not 'true' — skipping the terminal-answer checks. See DEPLOYMENT.md."
          fi

          exit $fail
